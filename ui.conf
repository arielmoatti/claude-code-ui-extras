# Claude Code UI Extras — configuration
# Change the border color around user messages.
# Accepts any valid CSS color value.
# Default: rgba(249,131,131,0.5)  — soft coral at 50% opacity
border_color=rgba(249,131,131,0.5)

# Show per-chat context window badge (e.g. "ctx 87K / 200K (44%)")
# Values: true | false   — default: true
show_context_window=true

# Diagnostic: console.log every rate_limit_event (for debugging overage badge).
# Values: true | false   — default: false
rate_limit_diag=false

# Max width of code / copy blocks in the chat. Caps the box so it soft-wraps
# instead of stretching the full chat width with a horizontal scrollbar.
# Wrapping is visual only - copied text stays one logical line per paragraph.
# Any CSS width (50%, 65%, 720px); set to 100% or none to disable (full width).
# Default: 50%
code_block_max_width=50%

# Minimize button on the AskUserQuestion panel. Adds a − button next to the ✕
# that collapses the floating question box to its one-line header (parked on top
# of the prompt box) so you can read the answer behind it; click ⬜ to restore.
# Values: true | false   — default: true
question_minimize=true

# Collapse height of long user messages, in px. Used both for display AND for
# the collapse decision: messages shorter than this show fully (no fade, no
# Show more); only genuinely taller ones get collapsed to this height.
# Native extension value is 60 (~3 lines); 175 is ~8 lines.
# Default: 175
user_msg_max_height=175

# "Collapse" button on user messages. Hovering any multi-line message reveals
# a button (bottom-right, next to Show more) that folds THAT prompt to a single
# line; a folded prompt shows "Expand" on hover. Alt+click folds/expands ALL
# prompts at once. Single-line prompts don't get the button. Fold state
# survives re-renders and lasts until reload.
# Values: true | false   — default: true
user_msg_minimize=true

# Time stamp under every message: when you sent a prompt and when Claude
# finished answering (HH:MM:SS), like any chat app. Kept in memory only, so
# messages from before a window reload stay unstamped.
# Values: true | false   - default: true
show_message_time=true

# Auto-update: check GitHub once per 24h for a newer version of inject-ui.sh.
# When a newer version is found, it's downloaded (syntax-checked) and swapped in.
# A Hebrew notification is printed at session start showing what changed.
# Set to false to pin your current version.
# Values: true | false   — default: true
auto_update=true
